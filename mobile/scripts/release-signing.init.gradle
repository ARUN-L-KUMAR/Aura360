/*
 * Aura360 - release signing + optional versionCode override, applied from OUTSIDE the generated
 * android/ project (which is gitignored and regenerated by `expo prebuild`).
 *
 * Used by scripts/build-release.ps1 via `gradlew -I scripts/release-signing.init.gradle`.
 * It never prints passwords and never creates keys.
 *
 * Credentials (all four required, env vars win over the file):
 *   file:  the properties file named by -Daura360.signing.file (normally mobile/keystore.properties)
 *            storeFile, storePassword, keyAlias, keyPassword
 *   env :  AURA360_UPLOAD_STORE_FILE, AURA360_UPLOAD_STORE_PASSWORD,
 *          AURA360_UPLOAD_KEY_ALIAS,  AURA360_UPLOAD_KEY_PASSWORD
 *
 * With no credentials at all the build is left untouched (release is then signed with the
 * debug key by the generated android/app/build.gradle) and a clear marker line is logged.
 * With partial or invalid credentials the build FAILS rather than silently falling back.
 */

def MARKER = '[aura360-signing]'
def FIELDS = [
    storeFile    : 'AURA360_UPLOAD_STORE_FILE',
    storePassword: 'AURA360_UPLOAD_STORE_PASSWORD',
    keyAlias     : 'AURA360_UPLOAD_KEY_ALIAS',
    keyPassword  : 'AURA360_UPLOAD_KEY_PASSWORD',
]

def cfg = [:]
File baseDir = null

def signingFilePath = System.getProperty('aura360.signing.file')
if (signingFilePath) {
    def f = new File(signingFilePath)
    if (f.isFile()) {
        baseDir = f.absoluteFile.parentFile
        def p = new Properties()
        f.withInputStream { p.load(it) }
        FIELDS.keySet().each { k ->
            def v = p.getProperty(k)
            if (v != null && v.trim()) cfg[k] = v.trim()
        }
    }
}
FIELDS.each { k, envName ->
    def v = System.getenv(envName)
    if (v != null && v.trim()) cfg[k] = v.trim()
}

def signingRequested = !cfg.isEmpty()
File storeFile = null
if (signingRequested) {
    def missing = FIELDS.keySet().findAll { !cfg.containsKey(it) }
    if (!missing.isEmpty()) {
        throw new GradleException("${MARKER} incomplete release signing configuration - missing: ${missing.join(', ')}. " +
            "Provide all four values (see mobile/keystore.properties.example) or none.")
    }
    storeFile = new File(cfg.storeFile)
    if (!storeFile.isAbsolute() && baseDir != null) storeFile = new File(baseDir, cfg.storeFile)
    if (!storeFile.isFile()) {
        throw new GradleException("${MARKER} release keystore not found: ${storeFile.name} (resolved from the configured storeFile)")
    }
    storeFile = storeFile.canonicalFile
}

def versionCodeOverride = null
def vc = System.getProperty('aura360.versionCode')
if (vc) {
    if (!(vc ==~ /\d{1,10}/) || vc.toLong() < 1 || vc.toLong() > 2100000000L) {
        throw new GradleException("${MARKER} invalid versionCode '${vc}' (must be an integer between 1 and 2100000000)")
    }
    versionCodeOverride = vc.toInteger()
}

allprojects { Project proj ->
    // Registered before the project is evaluated, so this runs after app/build.gradle (which sets
    // release.signingConfig = debug) and before AGP finalises the DSL.
    proj.afterEvaluate {
        if (!proj.plugins.hasPlugin('com.android.application')) return
        def android = proj.extensions.getByName('android')

        if (versionCodeOverride != null) {
            android.defaultConfig.versionCode = versionCodeOverride
            proj.logger.lifecycle("${MARKER} versionCode overridden to ${versionCodeOverride}")
        }

        if (signingRequested) {
            def releaseSigning = android.signingConfigs.maybeCreate('release')
            releaseSigning.storeFile = storeFile
            releaseSigning.storePassword = cfg.storePassword
            releaseSigning.keyAlias = cfg.keyAlias
            releaseSigning.keyPassword = cfg.keyPassword
            android.buildTypes.getByName('release').signingConfig = releaseSigning
            proj.logger.lifecycle("${MARKER} production release signing APPLIED (keystore: ${storeFile.name}, alias: ${cfg.keyAlias})")
        } else {
            proj.logger.lifecycle("${MARKER} NO production signing configured - release build is signed with the DEBUG key")
        }
    }
}
